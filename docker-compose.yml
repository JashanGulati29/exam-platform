version: '3.9'

# -------------------------------------------------------
# Docker Compose — brings up Postgres, the Node API, and
# the Vite dev server with a single `docker compose up`.
# -------------------------------------------------------

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js / Express API + Socket.io
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: exam_platform
      JWT_ACCESS_SECRET: change_this_secret_before_production
      JWT_REFRESH_SECRET: change_this_other_secret_before_production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '5000:5000'

  # Vite dev server (React frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src

volumes:
  pgdata:
